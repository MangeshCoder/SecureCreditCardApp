<nav class="navbar navbar-expand navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand fw-semibold" routerLink="/">Secure Credit EMI</a>

    @if (auth.isLoggedIn()) {
      <ul class="navbar-nav me-auto">
        @if (auth.isAdmin()) {
          <li class="nav-item"><a class="nav-link" routerLink="/admin/cardholders" routerLinkActive="active">Cardholders</a></li>
          <li class="nav-item"><a class="nav-link" routerLink="/admin/cards" routerLinkActive="active">All cards</a></li>
        } @else {
          <li class="nav-item"><a class="nav-link" routerLink="/cards" routerLinkActive="active">My cards</a></li>
        }
      </ul>
      <span class="navbar-text text-white me-3">
        {{ auth.currentUser()?.fullName }}
        <span class="badge bg-light text-primary ms-1">{{ auth.currentUser()?.role }}</span>
      </span>
      <button class="btn btn-outline-light btn-sm" (click)="auth.logout()">Logout</button>
    }
  </div>
</nav>

<main class="container pb-5">
  <router-outlet />
</main>
