<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-4">Sign in</h1>

        @for (e of errors(); track e) {
          <div class="alert alert-danger py-2">{{ e }}</div>
        }

        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input id="email" type="email" class="form-control" formControlName="email" autocomplete="username"
                   [class.is-invalid]="form.controls.email.touched && form.controls.email.invalid">
            <div class="invalid-feedback">Enter a valid email.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input id="password" type="password" class="form-control" formControlName="password" autocomplete="current-password"
                   [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid">
            <div class="invalid-feedback">Password is required.</div>
          </div>
          <button class="btn btn-primary w-100" type="submit" [disabled]="busy()">
            {{ busy() ? 'Signing in…' : 'Sign in' }}
          </button>
        </form>

        <p class="mt-3 mb-0 text-center">New customer? <a routerLink="/register">Create an account</a></p>
      </div>
    </div>
  </div>
</div>
